        - asset: assets/fonts/PlayfairDisplay[wght].ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay[wght].ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay[wght].ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald[wght].ttf
          weight: 400
        - asset: assets/fonts/Oswald[wght].ttf
          weight: 500
        - asset: assets/fonts/Oswald[wght].ttf
          weight: 600
        - asset: assets/fonts/Oswald[wght].ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat[wght].ttf
          weight: 400
        - asset: assets/fonts/Caveat[wght].ttf
          weight: 500
        - asset: assets/fonts/Caveat[wght].ttf
